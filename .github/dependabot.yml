version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: '/Views/CompileCheck'
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # The compile check mirrors the kit's Windows App SDK 1.8 line, which every consuming app
      # ships with (Microsoft.WindowsAppRuntime.1.8); it moves when the kit does.
      - dependency-name: Microsoft.WindowsAppSDK
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
