version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: '/Views/CompileCheck'
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # The compile check builds the page against the exact Windows App SDK version the kit pins,
      # which is what every consuming app compiles with. It moves by hand when the kit's pin
      # moves, patches included, so it never checks against a version no app uses.
      - dependency-name: Microsoft.WindowsAppSDK

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
